# Laura on-prem / server stack (docs/14-enterprise.md).
#
# The API currently uses the embedded SQLite store (volume `laura-data`). The
# Postgres / Redis / Qdrant / MinIO services below are the collaboration-plane
# infrastructure (report: "Optional Collaboration Plane") wired and ready for the
# server-mode backends (extras: psycopg/celery/qdrant). Bring up just `api` for a
# minimal deployment.

services:
  api:
    build:
      context: ../services/local-api
    # Ohne Regel kommt der Dienst nach einem Docker-Neustart nicht wieder:
    # gemessen 04.09.2026 waren alle laura-Container zurueck, nur dieser
    # fehlte — und der Marketing-Agent meldete "Laura nicht erreichbar",
    # obwohl nichts kaputt war. Die Datendienste unten halten ihre Daten in
    # Volumes und werden bei Bedarf mitgestartet; dieser hier ist der, den
    # von aussen jemand erwartet.
    restart: unless-stopped
    environment:
      LAURA_HOST: 0.0.0.0
      LAURA_PORT: "8765"
      LAURA_WORKSPACE: /data/workspace
      LAURA_TOKEN: ${LAURA_TOKEN:-}
      # Objektspeicher: eine Kopie jedes fertigen Renders und jedes importierten
      # Quellvideos landet im Bucket, damit marketing und sales-claw das Material
      # HOLEN koennen statt nur zu wissen, dass es existiert. Werte gehoeren nach
      # deploy/.env (gitignoriert). `host.docker.internal` ist aus diesem Container
      # gemessen erreichbar (HTTP 200); `127.0.0.1` waere der Container selbst.
      # Ohne URL UND Key bleibt der Speicher aus und Laura arbeitet rein lokal.
      LAURA_STORAGE_URL: ${LAURA_STORAGE_URL:-}
      LAURA_STORAGE_KEY: ${LAURA_STORAGE_KEY:-}
      LAURA_STORAGE_BUCKET: ${LAURA_STORAGE_BUCKET:-laura}
      # Server-mode targets: hier bewusst NICHT gesetzt.
      #
      # `create_database()` schaltet allein durch das VORHANDENSEIN von DATABASE_URL
      # auf den Postgres-Zweig um -- unabhaengig davon, ob dort etwas laeuft. Diese
      # Datei setzte sie fest verdrahtet, obwohl ihr eigener Kopf sagt, die API nutze
      # SQLite, und obwohl postgres/redis/qdrant hier ueblicherweise nicht gestartet
      # werden. Der laufende Container hatte sie folgerichtig NICHT -- ein `up -d`
      # haette ihn auf einen Postgres umgelegt, den es nicht gibt. Dieselbe Falle hat
      # am 04.09. schon einmal zugeschlagen.
      #
      # Wer den Server-Modus will, setzt sie in deploy/.env und startet die
      # zugehoerigen Dienste mit.
      # DATABASE_URL: postgresql://laura:laura@postgres:5432/laura
      # REDIS_URL: redis://redis:6379/0
      # QDRANT_URL: http://qdrant:6333
      # Transkription an die GPU-Laufzeit abgeben (04.09.2026). Ohne diese
      # Zeile transkribiert das Backend in-process auf der CPU — und im
      # gebauten Image fehlt faster_whisper ganz, es kann es also gar nicht.
      # Die Laufzeit laeuft daneben und meldet `device: cuda`.
      #
      # WARUM UEBER DEN HOST und nicht ueber den Containernamen: die Laufzeit
      # gehoert einem ANDEREN compose-Projekt (analysis-runtime_default). Ein
      # `docker network connect` waere nach jedem Neuanlegen wieder weg — so
      # wie beim `laura-qdrant`, der seinen Alias `qdrant` nur zur Laufzeit
      # traegt. Ihr Port ist ohnehin veroeffentlicht (8896:8896), und dieser
      # Weg ueberlebt das Neuanlegen beider Seiten.
      #
      # Seit dem Umzug auf den Mini-PC (22.09.2026) aus der Umgebung statt fest
      # verdrahtet: `host.docker.internal` bedeutet auf JEDER Maschine etwas
      # anderes -- auf der VM zeigte es auf die VM selbst, wo keine Laufzeit
      # laeuft. Dieselbe Datei laeuft jetzt auf beiden Rechnern, nur deploy/.env
      # unterscheidet sich (dort die Tailscale-Adresse des Windows-Rechners).
      # Die Vorgabe bleibt der bisherige Wert, damit auf Windows nichts kippt.
      LAURA_ANALYSIS_URL: ${LAURA_ANALYSIS_URL:-http://host.docker.internal:8896}
      # Stimme fuer Voiceover/Narrated Reel (Video-Claw, 17.10.2026): auf der VM der deutsche
      # Sprech-Dienst des Marketing-PCs ueber Tailscale (/voiceover, Vertrag wie tts-sidecar).
      # Leer = Vorgaben des Backends (127.0.0.1:8898, Backend aus der Anfrage).
      LAURA_VOICEOVER_URL: ${LAURA_VOICEOVER_URL:-}
      LAURA_VOICEOVER_BACKEND: ${LAURA_VOICEOVER_BACKEND:-}
      LAURA_VOICEOVER_TIMEOUT: ${LAURA_VOICEOVER_TIMEOUT:-}
    extra_hosts:
      # Docker Desktop legt den Namen von selbst an; auf einem Linux-Host
      # nicht. Damit laeuft dieselbe Datei auf beiden.
      - "host.docker.internal:host-gateway"
    ports:
      - "8765:8765"
    volumes:
      - laura-data:/data
    depends_on:
      - postgres
      - redis
      - qdrant
      - minio

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: laura
      POSTGRES_PASSWORD: laura
      POSTGRES_DB: laura
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: laura
      MINIO_ROOT_PASSWORD: laura-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  laura-data:
  pg-data:
  qdrant-data:
  minio-data:
